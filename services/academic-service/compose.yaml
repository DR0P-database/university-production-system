services:
  academic-migration:
    build:
      context: .
    image: university-system/academic-service:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${ACADEMIC_DB_NAME}
      DATABASE_USER: ${ACADEMIC_DB_USER}
      DATABASE_PASSWORD: ${ACADEMIC_DB_PASSWORD}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: ${MONGODB_ACADEMIC_USER:-academic_service}
      MONGODB_PASSWORD: ${MONGODB_ACADEMIC_PASSWORD:-academic-mongo-local-password}
      MONGODB_AUTH_SOURCE: ${MONGODB_ACADEMIC_DB:-academic_content}
      MONGODB_ACADEMIC_DB: ${MONGODB_ACADEMIC_DB:-academic_content}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb-academic-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - services-network
      - database-network

  academic-service:
    build:
      context: .
    image: university-system/academic-service:dev
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${ACADEMIC_DB_NAME}
      DATABASE_USER: ${ACADEMIC_DB_USER}
      DATABASE_PASSWORD: ${ACADEMIC_DB_PASSWORD}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: ${MONGODB_ACADEMIC_USER:-academic_service}
      MONGODB_PASSWORD: ${MONGODB_ACADEMIC_PASSWORD:-academic-mongo-local-password}
      MONGODB_AUTH_SOURCE: ${MONGODB_ACADEMIC_DB:-academic_content}
      MONGODB_ACADEMIC_DB: ${MONGODB_ACADEMIC_DB:-academic_content}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_LECTURES_INDEX: ${ELASTICSEARCH_LECTURES_INDEX:-lectures}
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PROJECTIONS_BOOTSTRAP_ON_STARTUP: "true"
    expose:
      - "8000"
    depends_on:
      academic-migration:
        condition: service_completed_successfully
      mongodb-academic-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - services-network
      - database-network
