services:
  schedule-migration:
    build:
      context: .
    image: university-system/schedule-service:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${SCHEDULE_DB_NAME}
      DATABASE_USER: ${SCHEDULE_DB_USER}
      DATABASE_PASSWORD: ${SCHEDULE_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - database-network

  schedule-service:
    build:
      context: .
    image: university-system/schedule-service:dev
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${SCHEDULE_DB_NAME}
      DATABASE_USER: ${SCHEDULE_DB_USER}
      DATABASE_PASSWORD: ${SCHEDULE_DB_PASSWORD}
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PROJECTIONS_BOOTSTRAP_ON_STARTUP: "true"
    expose:
      - "8000"
    depends_on:
      schedule-migration:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - services-network
      - database-network
