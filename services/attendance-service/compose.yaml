services:
  attendance-service:
    build:
      context: .
    image: university-system/attendance-service:dev
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${ATTENDANCE_DB_NAME}
      DATABASE_USER: ${ATTENDANCE_DB_USER}
      DATABASE_PASSWORD: ${ATTENDANCE_DB_PASSWORD}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - services-network
