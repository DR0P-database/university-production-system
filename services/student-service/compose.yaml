services:
  student-migration:
    build:
      context: .
    image: university-system/student-service:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${STUDENT_DB_NAME}
      DATABASE_USER: ${STUDENT_DB_USER}
      DATABASE_PASSWORD: ${STUDENT_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - database-network

  student-service:
    build:
      context: .
    image: university-system/student-service:dev
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${STUDENT_DB_NAME}
      DATABASE_USER: ${STUDENT_DB_USER}
      DATABASE_PASSWORD: ${STUDENT_DB_PASSWORD}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STUDENT_CACHE_TTL_SECONDS: ${STUDENT_CACHE_TTL_SECONDS:-86400}
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PROJECTIONS_BOOTSTRAP_ON_STARTUP: "true"
    expose:
      - "8000"
    depends_on:
      student-migration:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - services-network
      - database-network
