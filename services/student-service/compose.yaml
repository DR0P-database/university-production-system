services:
  student-migration:
    build:
      context: .
    image: university-system/student-service:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${STUDENT_DB_NAME}
      DATABASE_USER: ${STUDENT_DB_USER}
      DATABASE_PASSWORD: ${STUDENT_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - services-network

  student-service:
    build:
      context: .
    image: university-system/student-service:dev
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${STUDENT_DB_NAME}
      DATABASE_USER: ${STUDENT_DB_USER}
      DATABASE_PASSWORD: ${STUDENT_DB_PASSWORD}
    expose:
      - "8000"
    depends_on:
      student-migration:
        condition: service_completed_successfully
    networks:
      - services-network
