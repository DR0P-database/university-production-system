[project]
name = "student-service"
version = "0.1.0"
description = "Student domain service for the university system"
authors = [{ name = "University System Team" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.redis]
optional = true

[tool.poetry.group.redis.dependencies]
redis = ">=5.0,<7.0"

[tool.poetry.group.mongodb]
optional = true

[tool.poetry.group.mongodb.dependencies]
pymongo = ">=4.10,<5.0"

[tool.poetry.group.neo4j]
optional = true

[tool.poetry.group.neo4j.dependencies]
neo4j = ">=5.27,<7.0"

[tool.poetry.group.elasticsearch]
optional = true

[tool.poetry.group.elasticsearch.dependencies]
elasticsearch = ">=8.16,<9.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
