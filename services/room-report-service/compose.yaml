services:
  room-report-service:
    build:
      context: .
    image: university-system/room-report-service:dev
    environment:
      ACADEMIC_SERVICE_URL: http://academic-service:8000
      SCHEDULE_SERVICE_URL: http://schedule-service:8000
      STUDENT_SERVICE_URL: http://student-service:8000
    expose:
      - "8000"
    depends_on:
      schedule-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - services-network
