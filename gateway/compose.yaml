services:
  gateway:
    build:
      context: .
    image: university-system/gateway:dev
    environment:
      ACADEMIC_SERVICE_URL: http://academic-service:8000
      STUDENT_SERVICE_URL: http://student-service:8000
      SCHEDULE_SERVICE_URL: http://schedule-service:8000
      ATTENDANCE_SERVICE_URL: http://attendance-service:8000
      GROUP_HOURS_REPORT_SERVICE_URL: http://group-hours-report-service:8000
      ROOM_REPORT_SERVICE_URL: http://room-report-service:8000
      REPORT_SERVICE_URL: http://report-service:8000
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-5}
      REPORT_TIMEOUT_SECONDS: ${REPORT_TIMEOUT_SECONDS:-60}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-university-gateway}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-university-api}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS:-5}
      AUTH_USERS_FILE: /app/config/dev-users.json
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      academic-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      group-hours-report-service:
        condition: service_healthy
      room-report-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - services-network
