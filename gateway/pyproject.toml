[project]
name = "university-gateway"
version = "0.1.0"
description = "API gateway for the university system"
authors = [{ name = "University System Team" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.27,<1.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pydantic-settings>=2.7,<3.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
