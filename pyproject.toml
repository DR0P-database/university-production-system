[project]
name = "university-production-system-dev"
version = "0.1.0"
description = "Development tooling for the university production system"
authors = [{ name = "University System Team" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "redis>=5.0,<7.0",
    "pymongo>=4.10,<5.0",
    "neo4j>=5.27,<7.0",
    "elasticsearch>=8.16,<9.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.9,<1.0"
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.25,<1.0"
mypy = ">=1.14,<2.0"
pre-commit = ">=4.0,<5.0"

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
    "gateway/app",
    "services/academic-service/app",
    "services/student-service/app",
    "services/schedule-service/app",
    "services/attendance-service/app",
]
exclude = [
    "**/migrations",  # Исключаем папки миграций
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "gateway/tests",
    "services/academic-service/tests",
    "services/student-service/tests",
    "services/schedule-service/tests",
    "services/attendance-service/tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
exclude = [
    "^gateway/tests/",
    "^services/.*/tests/",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
