services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
      PGDATA: /var/lib/postgresql/data/pgdata
      ACADEMIC_DB_NAME: ${ACADEMIC_DB_NAME}
      ACADEMIC_DB_USER: ${ACADEMIC_DB_USER}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD}
      STUDENT_DB_NAME: ${STUDENT_DB_NAME}
      STUDENT_DB_USER: ${STUDENT_DB_USER}
      STUDENT_DB_PASSWORD: ${STUDENT_DB_PASSWORD}
      SCHEDULE_DB_NAME: ${SCHEDULE_DB_NAME}
      SCHEDULE_DB_USER: ${SCHEDULE_DB_USER}
      SCHEDULE_DB_PASSWORD: ${SCHEDULE_DB_PASSWORD}
      ATTENDANCE_DB_NAME: ${ATTENDANCE_DB_NAME}
      ATTENDANCE_DB_USER: ${ATTENDANCE_DB_USER}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - services-network

  pgadmin:
    image: dpage/pgadmin4:9.11
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - services-network

volumes:
  postgres-data:
  pgadmin-data:
