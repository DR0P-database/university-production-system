[project]
name = "lab1-architecture"
version = "1.0.0"
description = "ЛР1: сервис аналитики посещаемости лекций поверх данных ПР3 (gateway + отдельный HTTP-сервис, JWT RS256, Swagger)"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.162.6",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "PyJWT[crypto]==2.15.1",
    "python-multipart==0.0.33",
    "pydantic==2.14.3",
    "cryptography==50.0.2",
    "redis==5.2.1",
    "pymongo==4.10.1",
    "neo4j==5.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
